<style id="hw-css">
.hw { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: var(--s5); align-items: start; margin-top: var(--s3); }
@media (max-width: 860px) { .hw { grid-template-columns: minmax(0, 1fr); } }
.hw-stage { position: relative; width: 100%; max-width: 640px; aspect-ratio: 1/1; border-radius: var(--r-card); overflow: hidden; background: #0c0b10; }
.hw-stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hw-stage .xp-tag { max-width: 92%; white-space: normal; line-height: 1.25; }
.hw-steps { list-style: none; padding: 0; margin: var(--s3) 0 0; display: grid; gap: 6px; }
.hw-steps li { margin: 0; }
.hw-steps button { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; align-items: center; padding: 10px 12px; border-radius: var(--r-control); border: 1px solid var(--border); background: var(--surface); position: relative; overflow: hidden; }
.hw-steps button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hw-steps .n { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 800 15px var(--display); background: var(--grid); color: var(--text-secondary); }
.hw-steps b { display: block; font: 700 15px/1.1 var(--display); color: var(--text-primary); }
.hw-steps em { display: block; font-style: normal; font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.hw-steps button.on { border-color: var(--accent); background: var(--surface-raised); }
.hw-steps button.on .n { background: var(--accent); color: #fff; }
.hw-steps .bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--accent); }
.hw-name { font-size: 13px; color: var(--text-muted); }
.hw-name b { font: 800 clamp(26px, 3.4vw, 38px)/1 var(--display); letter-spacing: -.03em; color: var(--text-primary); margin-right: 8px; }
.hw-unet { width: 100%; max-width: 360px; height: auto; margin-top: var(--s3); }
.hw-unet .u { fill: var(--grid); }
.hw-unet .sk { fill: none; stroke: var(--axis); stroke-width: 1.5; stroke-dasharray: 3 3; }
.hw-unet .ut { font: 600 11px var(--mono); fill: var(--text-muted); }
.hw-unet.on .u { animation: hw-pulse 1.4s ease-in-out infinite; }
@keyframes hw-pulse { 0%, 100% { fill: var(--grid); } 50% { fill: var(--held-out); } }
@media (prefers-reduced-motion: reduce) { .hw-unet.on .u { animation: none; fill: var(--held-out); } }
.hw-left { min-width: 0; }
.hw-left .xp-tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: var(--s3); gap: var(--s2); }
.hw-left .xp-tile { padding: 10px; }
.hw-left .xp-tile .v { font-size: 24px; }
.hw-left .xp-tile .l { font-size: 11px; }
@media (max-width: 560px) { .hw-left .xp-tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.hw-name { margin-top: var(--s3); }
.hw-side .controls { margin-top: 0; }
</style>
