<style id="vz-css">
/* text diet 2: visual replacements for prose */
#overview .cols3, #overview .sub-h, #overview .src, #findings, #stage-list { display: none !important; }
.vz-stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: var(--s3); margin-bottom: var(--s5); }
@media (max-width: 1023px) { .vz-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 520px) { .vz-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.vz-stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: 14px 12px 12px; min-width: 0; }
.vz-stat svg { width: 30px; height: 30px; display: block; color: var(--accent); margin-bottom: 8px; }
.vz-stat .n { font: 800 clamp(26px, 3vw, 36px)/1 var(--display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.vz-stat .n small { font-size: .5em; font-weight: 700; margin-left: 2px; color: var(--text-secondary); }
.vz-stat .l { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.vz-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s4); }
@media (max-width: 860px) { .vz-cards { grid-template-columns: minmax(0, 1fr); } }
.vz-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-card); padding: 16px; min-width: 0; }
.vz-card h3 { font: 750 20px/1.1 var(--display); letter-spacing: -.02em; margin: 6px 0 12px; }
.vz-card .step { font: 600 11px/1 var(--mono); color: var(--text-muted); letter-spacing: .08em; text-transform: uppercase; }
.vz-art { width: 100%; height: 96px; display: block; border-radius: var(--r-control); background: var(--surface-raised); }
.vz-find { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s4); margin-bottom: var(--s6); }
@media (max-width: 1100px) { .vz-find { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .vz-find { grid-template-columns: minmax(0, 1fr); } }
.vz-big { font: 800 clamp(34px, 4vw, 46px)/1 var(--display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.vz-cap { font-size: 13px; color: var(--text-secondary); margin: 4px 0 12px; }
.vz-row { display: grid; grid-template-columns: 74px minmax(0, 1fr) 38px; align-items: center; gap: 8px; font-size: 12px; color: var(--text-secondary); margin-top: 7px; }
.vz-row .t { height: 10px; background: var(--grid); border-radius: 5px; overflow: hidden; }
.vz-row .t i { display: block; height: 100%; border-radius: 5px; transform-origin: left; animation: vz-grow .9s cubic-bezier(.2,.7,.2,1) both; }
.vz-row b { color: var(--text-primary); text-align: right; font-variant-numeric: tabular-nums; }
@keyframes vz-grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@media (prefers-reduced-motion: reduce) { .vz-row .t i { animation: none; } }
.c-first { background: var(--ink-muted); } .c-final { background: var(--held-out); } .c-hot { background: var(--bias-warm); } .c-cool { background: var(--bias-cool); } .c-good { background: var(--success-text); }
.vz-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
/* clarity pass: fewer words, no stretched empty cards */
.ch .subt, #figures-h + p, .figs figcaption, .callout, .kpi:not(.hero-kpi) .sub, .kpi .sub2:not(.delta) { display: none !important; }
.g12 > .card { align-self: start; }
.figs { margin-top: var(--s3); }
.vz-find .vz-card, .vz-cards .vz-card { align-self: stretch; }
.vz-art { min-height: 128px; }
.vz-card .vz-art:not(svg) { display: flex; flex-direction: column; justify-content: center; }
.hero .kpi.hero-kpi .sub { display: none; }
.figs figure:last-child:nth-child(odd) { grid-column: 1 / -1; }
.card figure { margin: var(--s4) 0 0; }
.card figure .frame { padding: 6px; background: var(--fig-frame); border: 1px solid var(--border); border-radius: var(--r-control); }
.card figure img { display: block; width: 100%; height: auto; }
.card figure figcaption { display: none; }
/* hotspot + cooling rows */
#v7, #v7fig { align-self: stretch !important; }
#v7fig { display: flex; flex-direction: column; }
#v7fig figure { margin: 0; }
#v8 { grid-column: 1 / -1; }
#v8 .chart-view { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 var(--s6); }
#v8 .chart-view > .legend { grid-column: 1 / -1; }
#v8 #co-chart-a { grid-column: 1; grid-row: 2 / span 2; }
#v8 .chart-view > h4 { grid-column: 2; grid-row: 2; margin-top: 0 !important; }
#v8 #co-chart-b { grid-column: 2; grid-row: 3; }
#v8 .chart-view > .notes { grid-column: 1 / -1; }
@media (max-width: 900px) { #v8 .chart-view { grid-template-columns: minmax(0, 1fr); } #v8 #co-chart-a, #v8 .chart-view > h4, #v8 #co-chart-b { grid-column: 1; grid-row: auto; } }
</style>
<div id="vz-ov">
  <div class="vz-stats" id="vz-stats"></div>
  <div class="vz-cards" id="vz-tools"></div>
</div>
