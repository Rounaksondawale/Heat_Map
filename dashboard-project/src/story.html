<section id="story" class="sec-block">
  <style>
    #story .wrap { max-width: 1640px; }
    .story { position: relative; }
    .story-stage { position: sticky; top: calc(var(--nav-h) + 12px); display: grid; grid-template-columns: minmax(0, 3.3fr) minmax(270px, 1fr); gap: 22px; align-items: center; }
    .story-view { position: relative; border-radius: 14px; overflow: hidden; box-shadow: 0 3px 0 rgba(70,52,12,.18), 0 18px 40px -22px rgba(30,20,60,.6); background: #1b1f5e; aspect-ratio: 1024 / 572; width: min(100%, calc((100vh - 120px) * 1.79)); max-width: 100%; justify-self: end; }
    .shot { position: absolute; inset: 0; opacity: 0; transition: opacity .6s ease; pointer-events: none; }
    .shot.on { opacity: 1; }
    .shot .back { position: absolute; inset: -14%; background-size: cover; background-position: center; filter: blur(42px) saturate(1.1) brightness(.82); }
    .shot.narrow img { width: auto; max-width: 100%; margin: 0 auto; -webkit-mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent); mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent); }
    .shot img { position: relative; display: block; width: 100%; height: 100%; object-fit: contain; }
    .shot.on img { animation: settle 7s ease-out both; }
    @keyframes settle { from { transform: scale(1.045); } to { transform: scale(1); } }
    .story-fact { position: absolute; left: 14px; top: 14px; z-index: 2; max-width: calc(100% - 28px); font: 500 clamp(13px, 1.1vw, 16px)/1.3 var(--mono); color: #fff; background: rgba(18,12,36,.66); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); padding: 8px 12px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); transition: opacity .3s; }
    .story-card { position: relative; background: var(--surface-raised); border-radius: 12px; padding: 26px 24px 22px; box-shadow: 0 3px 0 rgba(70,52,12,.14), inset 0 0 0 1px var(--border); min-width: 0; }
    .story-card::before { content: ""; position: absolute; left: -9px; top: 64px; width: 20px; height: 20px; background: var(--surface-raised); transform: rotate(45deg); box-shadow: -1px 1px 0 var(--border); }
    .story-card .n { display: inline-block; font: 600 13px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; background: var(--lego-yellow); color: #3b2f00; padding: 7px 11px; border-radius: 4px; box-shadow: inset 0 -2px 0 rgba(0,0,0,.15); }
    .story-card h3 { font: 500 clamp(28px, 3.1vw, 44px)/1.08 var(--display); margin: 16px 0 12px; letter-spacing: -.01em; }
    .story-card p { font-size: clamp(16px, 1.35vw, 20px); line-height: 1.55; color: var(--text-secondary); margin: 0; }
    .story-dots { display: flex; gap: 8px; margin-top: 24px; align-items: center; }
    .story-dots button { width: 22px; height: 12px; border-radius: 3px; border: 0; background: var(--grid); cursor: pointer; padding: 0; box-shadow: inset 0 -2px 0 rgba(0,0,0,.08); }
    .story-dots button[aria-current="true"] { background: var(--lego-red); width: 34px; }
    .story-dots span { margin-left: auto; font-size: 12px; color: var(--text-muted); }
    @media (max-width: 860px) {
      .story-stage { grid-template-columns: minmax(0, 1fr); gap: 12px; }
      .story-view { width: 100%; justify-self: stretch; }
      .story-card { padding: 16px; } .story-card::before { display: none; } .story-card p { font-size: 15px; }
      .story-dots { margin-top: 12px; } .story-fact { font-size: 11px; left: 8px; top: 8px; padding: 6px 9px; }
    }
    @media (prefers-reduced-motion: reduce) { .shot { transition: none; } .shot.on img { animation: none; } }
  </style>
  <div class="wrap">
    <div class="sec-head">
      <div class="eyebrow">How it works</div>
      <h2>Meet the scientist</h2>
    </div>
    <div class="story" id="storyTrack">
      <div class="story-stage" id="storyStage">
        <div class="story-view" id="storyView" role="img" aria-label="A brick-built scientist explains each step of the project in front of a changing scene">
          <div class="story-fact" id="sF"></div>
        </div>
        <div class="story-card" aria-live="polite">
          <span class="n" id="sN"></span>
          <h3 id="sT"></h3>
          <p id="sP"></p>
          <div class="story-dots" id="sDots" role="group" aria-label="Story steps"></div>
        </div>
      </div>
    </div>
  </div>
</section>
