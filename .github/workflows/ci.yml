name: CI/CD

# Every push and pull request: syntax check + the test suite (a synthetic city, no real data, no internet).
# Pushes to main also build the container image and, if you choose a target below, deploy it.
#
# Choose where to deploy with the repository variable DEPLOY_TARGET (Settings > Secrets and variables > Actions > Variables):
#   huggingface   needs variable HF_SPACE (for example your-name/urban-heat) and secret HF_TOKEN (a write token)
#   azure         needs variables AZURE_CONTAINER_APP, AZURE_RESOURCE_GROUP and secrets AZURE_CLIENT_ID, AZURE_TENANT_ID,
#                 AZURE_SUBSCRIPTION_ID (an app registration with a federated credential for this repository)
# Leave DEPLOY_TARGET unset to only test and build.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-app.txt
      - name: Install PyTorch (CPU) and the app requirements
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-app.txt
      - name: Syntax check
        run: python -m compileall -q extraction pre_processing models dashboard tests
      - name: Tests
        run: python -m unittest discover -s tests -v

  image:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that the model files are in the repository
        run: |
          test -f Deploy/best.pt || { echo "::error::Deploy/best.pt is missing"; exit 1; }
          test -f Deploy/meta.json || { echo "::error::Deploy/meta.json is missing: copy pre_processing/patches/meta.json from the training run into Deploy/"; exit 1; }
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-huggingface:
    needs: image
    if: vars.DEPLOY_TARGET == 'huggingface'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push the app to the Hugging Face Space (it builds the Dockerfile itself)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          mkdir space
          cp -r Dockerfile .dockerignore requirements-app.txt dashboard extraction pre_processing models .streamlit space/
          mkdir -p space/Deploy
          cp Deploy/best.pt Deploy/meta.json Deploy/README.md space/Deploy/
          printf -- '---\ntitle: Urban Heat Hotspots\nemoji: 🔥\nsdk: docker\napp_port: 8501\n---\n' > space/README.md
          cd space
          git init -q -b main
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Deploy ${GITHUB_SHA}"
          git push -f "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main

  deploy-azure:
    needs: image
    if: vars.DEPLOY_TARGET == 'azure'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Point the container app at the new image
        run: |
          az containerapp update \
            --name "${{ vars.AZURE_CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ needs.image.outputs.image }}:${{ github.sha }}"
